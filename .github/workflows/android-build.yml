name: Android build

on:
  push:
    branches:
      - main
      - phase-1-ime-foundation
      - phase-1-touch-response
  pull_request:
    branches:
      - main
      - phase-1-ime-foundation
      - phase-1-touch-response
  workflow_dispatch:
    inputs:
      build_apk:
        description: "Build and upload the debug APK"
        required: true
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Run unit tests
        run: gradle --no-daemon :app:testDebugUnitTest

      - name: Build debug APK
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.build_apk == true }}
        run: gradle --no-daemon :app:assembleDebug

      - name: Upload debug APK
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.build_apk == true }}
        uses: actions/upload-artifact@v4
        with:
          name: ai-keyboard-phase-1-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
